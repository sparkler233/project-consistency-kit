# 一致性机制 version: 2026-10-02
name: Validate and publish clean distribution

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate clean distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Test startup checks
        run: node scripts/test-startup-check.mjs
      - name: Test compact feedback
        run: node scripts/test-compact-feedback.mjs
      - name: Test synced guard
        run: node scripts/test-synced-guard.mjs
      - name: Test synced migration
        run: node scripts/test-synced-migration.mjs
      - name: Test wrapup scope and decision scripts
        run: node scripts/test-wrapup-scripts.mjs
      - name: Test parallel scripts and hooks
        run: |
          node scripts/test-task.mjs
          node scripts/test-parallel.mjs
          node scripts/test-task-state.mjs
          node scripts/test-recent-decisions.mjs
      - name: Test hook failure trace and self-check
        run: |
          node scripts/test-hook-observability.mjs
          node .agents/hooks/selfcheck.mjs
      - name: Build and verify
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          scripts/build-distribution.sh \
            --output-dir "$RUNNER_TEMP/project-consistency-release" \
            --source-ref "$SOURCE_REF"
          # 再按安装时的口径校验一次:获取脚本里按版本要求的文件清单是手写的,与分发清单不一致时在这里发现
          bash skills/project-consistency-installer/scripts/fetch-kit.sh \
            --verify-dir "$RUNNER_TEMP/project-consistency-release/project-consistency-kit"

  validate-windows:
    name: Validate Windows adapters
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Test startup checks
        run: node scripts/test-startup-check.mjs
      - name: Test compact feedback
        run: node scripts/test-compact-feedback.mjs
      - name: Test synced guard
        run: node scripts/test-synced-guard.mjs
      - name: Test synced migration
        run: node scripts/test-synced-migration.mjs
      - name: Test wrapup scope and decision scripts
        run: node scripts/test-wrapup-scripts.mjs
      - name: Test parallel scripts and hooks
        run: |
          node scripts/test-task.mjs
          node scripts/test-parallel.mjs
          node scripts/test-task-state.mjs
          node scripts/test-recent-decisions.mjs
      - name: Test hook failure trace and self-check
        run: |
          node scripts/test-hook-observability.mjs
          node .agents/hooks/selfcheck.mjs
      - name: Validate Windows adapters and clean distribution
        shell: powershell
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          if ((Get-Content -LiteralPath .\CLAUDE.md -Raw).Trim() -ne '@AGENTS.md') {
            throw 'CLAUDE.md is not the cross-platform AGENTS import adapter'
          }
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $bash)) { throw 'Git Bash is missing' }
          $outputDir = Join-Path $env:RUNNER_TEMP 'project-consistency-release'
          $outputDirBash = & $bash -lc 'cygpath -u -- "$1"' -- $outputDir
          & $bash scripts/build-distribution.sh --output-dir $outputDirBash --source-ref $env:SOURCE_REF
          if ($LASTEXITCODE -ne 0) { throw 'Windows distribution build failed' }
          & .\scripts\test-windows-adapters.ps1 `
            -KitDir (Join-Path $outputDir 'project-consistency-kit')

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, validate-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
      - name: Build clean release assets
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          scripts/build-distribution.sh \
            --output-dir "$RUNNER_TEMP/project-consistency-release" \
            --source-ref "$SOURCE_REF"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # 带 - 的 tag(如 v2.0.0-preview.1)发为预发布,GitHub 的 latest 不指向它
          prerelease=()
          case "$RELEASE_TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" "${prerelease[@]}" \
            "$RUNNER_TEMP/project-consistency-release/project-consistency-kit.tar.gz" \
            "$RUNNER_TEMP/project-consistency-release/project-consistency-kit.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Project Consistency Kit $RELEASE_TAG"
