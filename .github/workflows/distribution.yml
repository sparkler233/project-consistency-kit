# 一致性机制 version: 2026-08-18
name: Validate and publish clean distribution

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate clean distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build and verify
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          scripts/build-distribution.sh \
            --output-dir "$RUNNER_TEMP/project-consistency-release" \
            --source-ref "$SOURCE_REF"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
      - name: Build clean release assets
        env:
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          scripts/build-distribution.sh \
            --output-dir "$RUNNER_TEMP/project-consistency-release" \
            --source-ref "$SOURCE_REF"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/project-consistency-release/project-consistency-kit.tar.gz" \
            "$RUNNER_TEMP/project-consistency-release/project-consistency-kit.tar.gz.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Project Consistency Kit $RELEASE_TAG"
